<!DOCTYPE html>
<html>
<title>BCIS Course Creator</title>
<body>
  <h1>BCIS Course Creator</h1>

  <form method="POST" action="php/createCourse.php">
    <input name="Code" type="text" placeholder="Course Code" required><br>
    <input name="Name" type="text" placeholder="Course Name" required><br>
    Course Points: <input name="Points" type="number" placeholder="Course Points" value="15" required><br>
    Semesters Offered: 1<input name="Semester1Offered" type="checkbox" placeholder="Semester 1">
    2<input name="Semester2Offered" type="checkbox" placeholder="Semester 2"><br>
    Prerequisites: <input name="Prerequisites" type="text" placeholder="e.g. MATH503 AND (COMP603 OR COMP610)"><br>
    Corequisites: <input name="Corequisites" type="text" placeholder="e.g. COMP500"><br>
    <input type="submit" value="Add Course">
  </form>
</body>
</html>
