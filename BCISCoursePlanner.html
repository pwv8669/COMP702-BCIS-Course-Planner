<!DOCTYPE html>
<html>
<head>

<script type="module" src="./javascript/app.js" ></script>
<style>
  /* Styling here */
    :root {
        --scale: .94vmin;
    }

    body {
        /* set default font */
        font-size: calc(1.5 * var(--scale));
        color: #ffffff;
        font-family: 'Trebuchet MS';
        font-weight: bolder;
        background-color: #373537;
        box-sizing: border-box;
        max-height: 100%;
        max-width: 100%;
    }

.top-selector-row {
  display: grid;
  grid-template-columns: max-content max-content max-content max-content 1fr;
  gap: calc(2 * var(--scale));
  width: 100%;
  padding-bottom: calc(1 * var(--scale));
}
#AutocompletePlanButton {
  grid-column: 4;
  align-self: start;
  justify-self: start;
  width: fit-content;
  height: 100%;
}
th {
  background-color: #6eacc4;
  font-size: calc(2 * var(--scale));
  text-align: center;
}
    .main-layout-container {
        display: block;
        width: 100%;
        margin: calc(.3 * var(--scale));
        padding: 0;
    }
.hidden-element {
  display: none;
  opacity: 0;
  transition: opacity 0.3s ease;
}
tr{
  scale: 1;
  transition: transform .9s;
  min-height: calc(12 * var(--scale));
}
tr:hover {
 scale:(1.025);
}
td:hover .hidden-element {
  opacity: 1;
}
td{
  height: calc(10 * var(--scale));
  font-size: 100%;

  font-weight: bolder;
  vertical-align: top;
}
.schedule-table td:nth-child(even){background-color: #3abd3a;}  /* Alternate between light and dark cells */
.schedule-table td:nth-child(odd) {background-color: #298429;}
.schedule-table {
    border-collapse: collapse;
    width: 100%;
    table-layout: fixed; /* Forces all 6 columns to stay exactly the same width */
    font-family: Arial, sans-serif;


}
.schedule-table td {
    background-color: #9c9c9c;
    color: white;
    padding: calc(1.2 * var(--scale)) calc(.8 * var(--scale));
    vertical-align: top;
    font-size: calc(2 * var(--scale));
    border: calc(.1 * var(--scale)) solid #6e7475;
    overflow-wrap: break-word;
    word-break: break-word;
}



.year-headers th {
    background-color: #822787;
    color: white;
    padding: calc(.8 * var(--scale));
    border: calc(.1 * var(--scale)) solid #6e7475;
    height: calc(.1 * var(--scale));
}
.semester-headers th {
    background-color: #bd6fc1;
    color: white;
    padding: calc(1 * var(--scale)) calc(.4 * var(--scale));
    font-size: calc(1.8 * var(--scale));
    border: calc(.1 * var(--scale)) solid #6e7475;
}
.schedule-table,
.schedule-table th{
    border: calc(.1 * var(--scale)) solid #373537 !important; 
}
.schedule-table td.cell-required:nth-child(even){background-color: #71a1dc  ;}  /* Alternate between light and dark cells */
.schedule-table td.cell-required:nth-child(odd) {background-color: #5286c5 ;}
.schedule-table td.cell-required {
    border: calc(.3 * var(--scale)) solid #3842af;
}
.majorcolor{background-color: #5286c5 !important;}
.minor1color{background-color: #9461af !important;}
.minor2color{background-color: #b75a9b !important;}
.selectioncolor{background-color: #71a1dc  ;}  /* Alternate between light and dark cells */
.minor1selectioncolor{background-color: #bc80dc  ;}  /* Alternate between light and dark cells */
.minor2selectioncolor{background-color: #dc7fc0  ;}  /* Alternate between light and dark cells */

.schedule-table td.cell-required-minor:nth-child(even){background-color: #bc80dc ;}  /* Alternate between light and dark cells */
.schedule-table td.cell-required-minor:nth-child(odd) {background-color: #9461af ;}
.schedule-table td.cell-required-minor {
    border: calc(.3 * var(--scale)) solid #5d3672;
}
.schedule-table td.cell-required-minor-second:nth-child(even){background-color: #dc7fc0 ;}  /* Alternate between light and dark cells */
.schedule-table td.cell-required-minor-second:nth-child(odd) {background-color: #b75a9b ;}
.schedule-table td.cell-required-minor-second {
    border: calc(.3 * var(--scale)) solid #723657;
}


.schedule-table td.cell-elective:nth-child(even){background-color: #636870 ;}  /* Alternate between light and dark cells */
.schedule-table td.cell-elective:nth-child(odd) {background-color: #4e5359 ;}
.schedule-table td.cell-elective {
    border: calc(.3 * var(--scale)) solid #0b0b0e;
}
.schedule-table td.cell-red-error {
    background-color: #b23b3b !important;
    border: calc(.3 * var(--scale)) solid #ff4d4d;
}
.schedule-table td.cell-yellow-warning {
    background-color: #d1a119 !important; 
    border: calc(.3 * var(--scale)) solid #ffdb4d;
}
.error-text-item {
    padding: calc(1 * var(--scale)) calc(1.4 * var(--scale));
    margin-bottom: calc(.6 * var(--scale));
    font-family: Arial, sans-serif;
    font-size: calc(2 * var(--scale));
    border-radius: calc(.4 * var(--scale));
    font-weight: 500;
}
.error-text-item.red-alert {
    background-color: #fdf2f2;
    color: #b81d1d;
    border-left: calc(.5 * var(--scale)) solid #de2a2a;
}
.error-text-item.yellow-alert {
    background-color: #fefaf0;
    color: #8a6d1c;
    border-left: calc(.5 * var(--scale)) solid #e3b022;
}
#red-error-list-container {
    min-height: calc(11.5 * var(--scale));
    max-height: calc(11.5 * var(--scale));
    overflow-y: auto;
    overflow-x: hidden;
    padding: calc(1 * var(--scale));
    background-color: #6e7475;
    border: calc(.1 * var(--scale)) solid #ccc;
    border-radius: calc(.6 * var(--scale));
    margin-top: calc(.1 * var(--scale));
}
#yellow-error-list-container {
    min-height: calc(11.5 * var(--scale));
    max-height: calc(11.5 * var(--scale));
    overflow-y: auto;
    overflow-x: hidden;
    padding: calc(1 * var(--scale));
    background-color: #6e7475;
    border: calc(.1 * var(--scale)) solid #ccc;
    border-radius: calc(.6 * var(--scale));
    margin-top: calc(.1 * var(--scale));
    margin-left: calc(1 * var(--scale));
}

.success-msg {
    color: #3abd3a;
    font-weight: bold;
}
.course-picker-sidebar {
    width: 100%;
    margin-right: calc(.2 * var(--scale));
    font-family: Arial, sans-serif;
}
.course-category summary {
    background-color: #bd6fc1;
    color: white;
    padding: calc(1.2 * var(--scale));
    margin-bottom: calc(.6 * var(--scale));
    cursor: pointer;
    font-weight: bold;
    font-size: calc(2 * var(--scale));
    list-style: none;
    border: calc(1 * var(--scale)) solid rgba(255, 255, 255, 0.2);
    transition: background 0.2s ease;
}
.course-category summary:hover 
{
    background-color: #6ba4c4;
}
.course-list {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: calc(.8 * var(--scale));
    padding: calc(1 * var(--scale)) 0;
}
#table-grid {
  display: grid;
  width: 100%;
  grid-template-columns: 5fr 1fr;
  min-height: calc(60 * var(--scale));
  align-items: stretch;
  clear: both;
  padding-bottom: calc(1 * var(--scale));

  
}
.driver {
  align-self: stretch;
}
.follower {
  grid-row: 1;
  grid-column: 2;
  position: relative;
  width: 100%;
}
#dynamic-course-sidebar {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;

  overflow-y: auto;
  overflow-x: hidden;
  padding-left: calc(1.2 * var(--scale));
  padding-right: calc(1.2 * var(--scale));
  border: calc(.1 * var(--scale)) solid #373537;
  border-radius: calc(.6 * var(--scale));
  background: #822787;
  box-sizing: border-box;
  color: white;
}
#dynamic-course-sidebar h3 {
    text-align: center;
    font-size: calc(3 * var(--scale));

}
    /* Draggable Items */
    .course-card {
        background-color: #bd6fc1;
        color: white;
        padding: calc(1 * var(--scale)) calc(.6 * var(--scale));
        border-radius: calc(.4 * var(--scale));
        cursor: grab;
        font-size: calc(2 * var(--scale));
        font-weight: bold;
        user-select: none;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        min-height: calc(8.5 * var(--scale));
        box-sizing: border-box;
        word-break: break-word;
    }
.course-card:active {
        cursor: grabbing;
}
.course-card-disabled {
    background-color: #555 !important;
    color: #ccc !important;
    cursor: not-allowed !important;
    opacity: .6;
}
    /* Visual cue when dragging over a table cell slot */
.schedule-table td.drag-over-cell {
    border: calc(.2 * var(--scale)) dashed #333 !important;
    background-color: #eaeaea !important;
    color: #333 !important;
}
table{
   width:100%;
}
.core{
  background-color: #4285b9;
}
.prereq-btn {
    position: absolute;
    margin-left:13.5%;
    padding: 0;
    font-size: 100%;
    background:#96969600;
    color: white;
    border: none;
    cursor: pointer;
    bottom:calc(.4 * var(--scale));
    width: 2%;
    aspect-ratio: 1 / 1;
    border-radius: 50%;
}
.prereq-list {
    margin-bottom: calc(3 * var(--scale)); 
    padding: calc(.6 * var(--scale));
    border-radius: 0px;
}
.major{
  background-color: #589dc5;
}
.minor{
  background-color: #68b8d5;
}
.elective{
  background-color: #8cc7dc;
}
.error{
  background-color: #dd695e;
}
button {
  color: #ffffff;
  font-family: 'Trebuchet MS'; 
  font-weight: bolder;
  border-radius: calc(.6 * var(--scale));
  border: 0px;
  background-color: #822787;
  font-size: calc(2 * var(--scale));
  padding: calc(2 * var(--scale));
  text-align: center;   
}
.button-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr); 
    gap: calc(1 * var(--scale)); 
    height: 100%;  
    padding: 0;
    margin-left: auto;
    grid-column: 4;
}
.button-grid button {
    width: 100%;
}
.button-grid form {
  margin: 0;
  padding: 0;
  height: 100%;
}
.button-grid form button {
  width: 100%;
  height: 100%;
}
select {
  color: #ffffff;
  font-family: 'Trebuchet MS'; 
  font-weight: bolder;
  outline:0px;
  border:0px;
  font-size: calc(2 * var(--scale));
  padding: calc(1.2 * var(--scale)); 
  background-color: #bd6fc1;
  width: 100%; 
  max-width: calc(35 * var(--scale)); 
  box-sizing: border-box;
}
select,button{
  cursor:pointer;
  transition: transform .2s;
}

select:hover,button:hover{
   transform: scale(1.025);

}
#ignoreModal {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.6);
  display: flex;
  justify-content: center;
  align-items: center;
}
#ignoreModal.hidden { display: none; }
.modal-content {
  background: #822787;
  color: white;
  padding: calc(2 * var(--scale));
  border-radius: calc(.8 * var(--scale));
  width: calc(30 * var(--scale));
}
.modal-buttons {
  display: flex;
  justify-content: space-between;
  margin-top: calc(1 * var(--scale));
}
.ignore-error-btn {
    font-size: calc(1.2 * var(--scale));
    padding: calc(.2 * var(--scale)) calc(.6 * var(--scale));
    margin-left: calc(.1 * var(--scale));
    background-color: #373537;
    border: calc(.1 * var(--scale)) solid #999;
    border-radius: calc(.4 * var(--scale));
    cursor: pointer;
}
.ignore-error-btn:hover {
    background-color: #bbb;
}
#ignored-errors-container {
    margin-top: calc(1 * var(--scale));
    padding: calc(1 * var(--scale));
    background-color: #6e7475; 
    border: calc(.1 * var(--scale)) solid #ccc;
    border-radius: calc(.6 * var(--scale)); 
    color: white;
    font-family: Arial, sans-serif;
    grid-column: span 2; 
    min-height: calc(11.5 * var(--scale));
    max-height: calc(11.5 * var(--scale));
    overflow-y: auto;
    overflow-x: hidden;
}
#ignored-errors-container h3 {
    margin: 0 0 calc(1 * var(--scale)) 0;
    font-size: calc(1.6 * var(--scale));
    font-weight: bold;
    color: #ffffff;
    background-color: #373537;
    padding: calc(.6 * var(--scale)) calc(1 * var(--scale));
    border-radius: calc(.4 * var(--scale));
    width: calc(13 * var(--scale));
}



.ignored-error-item {
    padding: calc(1 * var(--scale)) calc(1.4 * var(--scale));
    margin-bottom: calc(.6 * var(--scale));
    font-size: calc(1.3 * var(--scale));
    border-radius: calc(.4 * var(--scale));
    background-color: #fefaf0; 
    color: #8a6d1c;            
    border-left: calc(.5 * var(--scale)) solid #e3b022; 
}
.delete-ignored-btn {
    font-size: calc(1.2 * var(--scale));
    padding: calc(.2 * var(--scale)) calc(.6 * var(--scale));
    margin-left: calc(1 * var(--scale));
    background-color: #373537;
    border: calc(.1 * var(--scale)) solid #999;
    border-radius: calc(.4 * var(--scale));
    cursor: pointer;
}
.delete-ignored-btn:hover {
    background-color: #6eacc4;
}
.bottom-section-grid {
  display: grid;
  grid-template-columns: 1fr 1fr; 
  grid-template-rows: auto auto;
  gap: calc(.1 * var(--scale));
  width: 100%;

  box-sizing: border-box;
}
.buttons-column {
  display: flex;
  width: 100%;
  flex-direction: column;
  grid-column: 5;
  align-items: flex-end;
}
.icon {
    width: calc(4 * var(--scale));
    stroke: #ffffff;
    fill: #ffffff;
    height: auto;
    stroke-width: calc(.06 * var(--scale));
}

.infoIcon {
    width: 70%;
    stroke: #ffffffe0;
    fill: #ffffffe0;
    height: 100%;
    object-fit: contain;
    
    stroke-width: calc(.04 * var(--scale));
}
.save-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: calc(1 * var(--scale)); 

}
.save-grid button{
    aspect-ratio: 3/2; 
}
.edit-grid {
    display: grid;
    grid-gap: calc(1 * var(--scale)); 
}

.file-grid {
    display: grid;
    grid-gap: calc(1 * var(--scale)); 
}
.button-link {
   color: #ffffff;
  font-family: 'Trebuchet MS'; 
  font-weight: bolder;
  border-radius: calc(.6 * var(--scale));
  background-color: #822787;
  font-size: calc(2 * var(--scale));
  padding: calc(1 * var(--scale));
  text-align: center;   
  text-decoration: none;

}
#pathwayOptionContainer {
  display: flex;
  flex-direction: row;
  align-items: center;
  gap: calc(.2 * var(--scale));
  flex-wrap: nowrap;
   width: 100%; 
   max-width: calc(90 * var(--scale)); 
  min-width: 0;
  grid-column: span 2; 
}
    #pathwayOptionContainer label,
    label[for="pathwaySelect"] {
        display: flex;
        flex-direction: column;
        font-size: calc(2 * var(--scale));
        justify-content: center;
        background-color: #822787;
        gap: calc(1 * var(--scale));
        padding: calc(1 * var(--scale));
        
        
        box-sizing: border-box;
        margin-right: calc(0 * var(--scale));

        flex: 0 1 auto; 
        max-width: calc(45 * var(--scale)); 
        min-width: 0; 
        white-space: nowrap; 
        text-overflow: ellipsis; 
        overflow: hidden;
    }

</style>
</head>

<script defer>


// JSPDF
//Create PDf from HTML...
function getPDF(){

		var HTML_Width = $(".schedule-table").width();
		var HTML_Height = $(".schedule-table").height();
		var top_left_margin = 15;
		var PDF_Width = HTML_Width+(top_left_margin*2);
		var PDF_Height = (PDF_Width*1.5)+(top_left_margin*2);
		var canvas_image_width = HTML_Width;
		var canvas_image_height = HTML_Height;
		
		var totalPDFPages = Math.ceil(HTML_Height/PDF_Height)-1;
		

		html2canvas($(".schedule-table")[0],{allowTaint:true}).then(function(canvas) {
			canvas.getContext('2d');
			
			console.log(canvas.height+"  "+canvas.width);
			
			
			var imgData = canvas.toDataURL("image/jpeg", 1.0);
			var pdf = new jsPDF('p', 'pt',  [PDF_Width, PDF_Height]);
		    pdf.addImage(imgData, 'JPG', top_left_margin, top_left_margin,canvas_image_width,canvas_image_height);
			
			
			for (var i = 1; i <= totalPDFPages; i++) { 
				pdf.addPage(PDF_Width, PDF_Height);
				pdf.addImage(imgData, 'JPG', top_left_margin, -(PDF_Height*i)+(top_left_margin*4),canvas_image_width,canvas_image_height);
			}
			
		    pdf.save("Study Plan.pdf");
        });
	};
</script>
