<!DOCTYPE html>
<html>
<head>

<script src="https://code.jquery.com/jquery-1.12.4.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/1.3.3/jspdf.min.js"></script>
<script src="https://html2canvas.hertzen.com/dist/html2canvas.js"></script>

<script type="module" src="./javascript/app.js" ></script>
<style>
  /* Styling here */
    body {
        /* set default font */
        font-size: 20px;
        color: #ffffff;
        font-family: 'Trebuchet MS';
        font-weight: bolder;
        background-color: #373537;
    }
.top-selector-row {
    display: flex;
    align-items: flex-start;
    gap: 20px;
    margin-bottom: 10px;
}

th {
  background-color: #6eacc4;
  font-size: 20px;
  text-align: center;
}
.main-layout-container {
    display: block;
    width: 100vw;
    margin: 0;
    padding: 0;
}
.hidden-element {
  display: none; /*temporarily removing hidden elements*/
  opacity: 0;
  transition: opacity 0.3s ease;
}
tr{
  scale: 1;
  transition: transform .9s;
  min-height: 120px;
}
tr:hover {
 scale:(1.025);
}
td:hover .hidden-element {
  opacity: 1;
}
td{
  height: 100px;
  font-size: 80%;

  font-weight: bolder;
  vertical-align: top;
}
.schedule-table td:nth-child(even){background-color: #3abd3a;}  /* Alternate between light and dark cells */
.schedule-table td:nth-child(odd) {background-color: #298429;}

.schedule-table {
    border-collapse: collapse;
    table-layout: fixed; /* Forces all 6 columns to stay exactly the same width */
    font-family: Arial, sans-serif;
}
.schedule-table td {
    background-color: #9c9c9c;
    color: white;
    padding: 12px 8px;
    vertical-align: top;
    font-size: 12px;
    border: 1px solid #6e7475;
    word-wrap: break-word;
}
.year-headers th {
    background-color: #822787;
    color: white;
    padding: 8px;
    border: 1px solid #6e7475;
}
.semester-headers th {
    background-color: #bd6fc1;
    color: white;
    padding: 10px 4px;
    font-size: 14px;
    border: 1px solid #6e7475;
}
.schedule-table,
.schedule-table th{
    border: 1px solid #373537 !important; 
}
.schedule-table td.cell-red-error {
    background-color: #b23b3b !important;
    border: 2px solid #ff4d4d;
}
.schedule-table td.cell-yellow-warning {
    background-color: #d1a119 !important; 
    border: 2px solid #ffdb4d;
}
.error-text-item {
    padding: 10px 14px;
    margin-bottom: 6px;
    font-family: Arial, sans-serif;
    font-size: 13px;
    border-radius: 4px;
    font-weight: 500;
}
.error-text-item.red-alert {
    background-color: #fdf2f2;
    color: #b81d1d;
    border-left: 5px solid #de2a2a;
}
.error-text-item.yellow-alert {
    background-color: #fefaf0;
    color: #8a6d1c;
    border-left: 5px solid #e3b022;
}
#error-list-container {
    max-height: 120px;
    overflow-y: auto;
    overflow-x: hidden;
    padding: 10px;
    background-color: #6e7475;
    border: 1px solid #ccc;
    border-radius: 6px;
    margin-top: 20px;
    float: left;
    width: 60%;
}
.success-msg {
    color: #3abd3a;
    font-weight: bold;
}
.course-picker-sidebar {
    width: 250px;
    margin-right: 20px;
    font-family: Arial, sans-serif;
}
.course-category summary {
    background-color: #bd6fc1;
    color: white;
    padding: 12px;
    margin-bottom: 6px;
    cursor: pointer;
    font-weight: bold;
    font-size: 14px;
    list-style: none;
    border: 1px solid rgba(255, 255, 255, 0.2);
    transition: background 0.2s ease;
}
.course-category summary:hover 
{
    background-color: #6ba4c4;
}
.course-list {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
    padding: 10px 0;
}

.table-grid {
  display: grid;
  width: 100vw;
  grid-template-columns: 5fr 1fr;
  align-items: stretch;
  clear: both;
}
.driver {
  align-self: stretch;
}
.follower {
  grid-row: 1;
  grid-column: 2;
  position: relative;
}

#dynamic-course-sidebar {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;

  overflow-y: auto;
  overflow-x: hidden;

  padding-right: 4px;
  border: 1px solid #373537;
  border-radius: 6px;
  background: #822787;
  box-sizing: border-box;
  color: white;
}


    /* Draggable Items */
.course-card {
        background-color: #bd6fc1;
        color: white;
        padding: 10px 6px;
        border-radius: 4px;
        cursor: grab;
        font-size: 11px;
        font-weight: bold;
        user-select: none;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        min-height: 85px;
        box-sizing: border-box;
        word-break: break-word;
}
.course-card:active {
        cursor: grabbing;
}

.course-card-disabled {
    background-color: #555 !important;
    color: #ccc !important;
    cursor: not-allowed !important;
    opacity: .6;
}
    /* Visual cue when dragging over a table cell slot */
.schedule-table td.drag-over-cell {
    border: 2px dashed #333 !important;
    background-color: #eaeaea !important;
    color: #333 !important;
}
table{
   width:100%;
}
.core{
  background-color: #4285b9;
}
.prereq-btn {
    position:fixed;
    margin-left:110px;
    padding: 4px;
    font-size: 12px;
    border-radius: 0px;
    background: #5a2ea6;
    color: white;
    border: none;
    cursor: pointer;
    margin-bottom: 0px;
    bottom:4px;
    width: 90px;

}
.prereq-list {
    margin-bottom: 30px; 
    padding: 6px;
    border-radius: 0px;
}
.major{
  background-color: #589dc5;
}
.minor{
  background-color: #68b8d5;
}
.elective{
  background-color: #8cc7dc;
}
.error{
  background-color: #dd695e;
}
button {
  color: #ffffff;
  font-family: 'Trebuchet MS'; 
  font-weight: bolder;
  border-radius: 6px;
  border: 0px;
  background-color: #822787;
  font-size: 20px;
  padding: 10px;
  text-align: center;   
}
.button-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr); 
    gap: 12px; 
    width: 300px;  
    padding: 10px;
}
.button-grid button {
    width: 100%;
}
select,label {
  color: #ffffff;
  font-family: 'Trebuchet MS'; 
  font-weight: bolder;
  outline:0px;
  border:0px;
  font-size: 20px;
  padding:12px; 
}
select,button{
  cursor:pointer;
  transition: transform .2s;
}
.yearheading{
  width: 33%; 
  text-align: center;
  background-color: #6eacc4;
  margin: 0.165%;
}

label{
  background-color: #822787;
  padding: 12.85px;
  margin-right: 10px;
  width: 400px;
  display: inline-block;
}

select{
   
  background-color: #bd6fc1;
}

select:hover,button:hover{
   transform: scale(1.025);

}

#ignoreModal {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.6);
  display: flex;
  justify-content: center;
  align-items: center;
}
#ignoreModal.hidden { display: none; }
.modal-content {
  background: #822787;
  color: white;
  padding: 20px;
  border-radius: 8px;
  width: 300px;
}
.modal-buttons {
  display: flex;
  justify-content: space-between;
  margin-top: 10px;
}

.ignore-error-btn {
    font-size: 12px;
    padding: 2px 6px;
    margin-left: 10px;
    background-color: #373537;
    border: 1px solid #999;
    border-radius: 4px;
    cursor: pointer;
}

.ignore-error-btn:hover {
    background-color: #bbb;
}

#ignored-errors-container {
    margin-top: 10px;
    padding: 10px;
    background-color: #6e7475; 
    border: 1px solid #ccc;
    border-radius: 6px;
    width: 60%; 
    float: left;
    color: white;
    font-family: Arial, sans-serif;
}


#ignored-errors-container h3 {
    margin: 0 0 10px 0;
    font-size: 16px;
    font-weight: bold;
    color: #ffffff;
    background-color: #373537;
    padding: 6px 10px;
    border-radius: 4px;
    width: 130px;
}


.ignored-error-item {
    padding: 10px 14px;
    margin-bottom: 6px;
    font-size: 13px;
    border-radius: 4px;
    background-color: #fefaf0; 
    color: #8a6d1c;            
    border-left: 5px solid #e3b022; 
}

.delete-ignored-btn {
    font-size: 12px;
    padding: 2px 6px;
    margin-left: 10px;
    background-color: #373537;
    border: 1px solid #999;
    border-radius: 4px;
    cursor: pointer;
}

.delete-ignored-btn:hover {
    background-color: #6eacc4;
}

</style>
</head>

<script defer>


// JSPDF
//Create PDf from HTML...
function getPDF(){

		var HTML_Width = $(".schedule-table").width();
		var HTML_Height = $(".schedule-table").height();
		var top_left_margin = 15;
		var PDF_Width = HTML_Width+(top_left_margin*2);
		var PDF_Height = (PDF_Width*1.5)+(top_left_margin*2);
		var canvas_image_width = HTML_Width;
		var canvas_image_height = HTML_Height;
		
		var totalPDFPages = Math.ceil(HTML_Height/PDF_Height)-1;
		

		html2canvas($(".schedule-table")[0],{allowTaint:true}).then(function(canvas) {
			canvas.getContext('2d');
			
			console.log(canvas.height+"  "+canvas.width);
			
			
			var imgData = canvas.toDataURL("image/jpeg", 1.0);
			var pdf = new jsPDF('p', 'pt',  [PDF_Width, PDF_Height]);
		    pdf.addImage(imgData, 'JPG', top_left_margin, top_left_margin,canvas_image_width,canvas_image_height);
			
			
			for (var i = 1; i <= totalPDFPages; i++) { 
				pdf.addPage(PDF_Width, PDF_Height);
				pdf.addImage(imgData, 'JPG', top_left_margin, -(PDF_Height*i)+(top_left_margin*4),canvas_image_width,canvas_image_height);
			}
			
		    pdf.save("Study Plan.pdf");
        });
	};
</script>
