<script defer>


// JSPDF
//Create PDf from HTML...
function getPDF(){

		var HTML_Width = $(".schedule-table").width();
		var HTML_Height = $(".schedule-table").height();
		var top_left_margin = 15;
		var PDF_Width = HTML_Width+(top_left_margin*2);
		var PDF_Height = (PDF_Width*1.5)+(top_left_margin*2);
		var canvas_image_width = HTML_Width;
		var canvas_image_height = HTML_Height;
		
		var totalPDFPages = Math.ceil(HTML_Height/PDF_Height)-1;
		

		html2canvas($(".schedule-table")[0],{allowTaint:true}).then(function(canvas) {
			canvas.getContext('2d');
			
			console.log(canvas.height+"  "+canvas.width);
			
			
			var imgData = canvas.toDataURL("image/jpeg", 1.0);
			var pdf = new jsPDF('p', 'pt',  [PDF_Width, PDF_Height]);
		    pdf.addImage(imgData, 'JPG', top_left_margin, top_left_margin,canvas_image_width,canvas_image_height);
			
			
			for (var i = 1; i <= totalPDFPages; i++) { 
				pdf.addPage(PDF_Width, PDF_Height);
				pdf.addImage(imgData, 'JPG', top_left_margin, -(PDF_Height*i)+(top_left_margin*4),canvas_image_width,canvas_image_height);
			}
			
		    pdf.save("Study Plan.pdf");
        });
	};
</script>

<script type="module" defer>
import {importschedule} from "./javascript/filehandler.js";
//this is for file input
const inputElement = document.getElementById("file_upload");
inputElement.addEventListener("change", handleFiles);


function handleFiles() {
  const fileList = this.files; /* now you can work with the file list */

const reader = new FileReader();

  reader.addEventListener("load", () => {
    // this will then display a text file
    const JsonParse = JSON.parse(reader.result);
    importschedule(JsonParse);
    
  });

  reader.readAsText(fileList[0]);
 
}
</script>
