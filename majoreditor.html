<!DOCTYPE html>
<html>

<style>
  /* Styling here */
body{
    /* set default font */
      font-size: 20px;
  color: #ffffff;
  font-family: 'Trebuchet MS'; 
  font-weight: bolder;
  background-color: #f4eee5;
}
div{
  background-color: #6eacc4;
}
input {
  color: #fcfbfa;
  font-family: 'Trebuchet MS'; 
  font-weight: bolder;
  border-radius: 1px;
  border:0px;
  background-color: #5c93ab;
  font-size: 20px;
  padding:10px;
  width:80%;
  text-align: left;   
}






/* input styling */
label {
  display: inline-block;
  cursor: pointer;
  position: relative;
  padding-left: 25px;
  margin-left: 15px;
  margin-top: 25px;
  vertical-align: center;
  font-size: 11px;
     transition: transform .2s;
}

label:hover {
     transform: scale(1.2);
}



label:before {
  content: "";
  display: inline-block;


  width: 16px;
  height: 16px;


  margin-right: 10px;
  position: absolute;
  left: 0;
  bottom: 1px;
  background-color: #396b8a;
}


input[type="checkbox"] {
    display: none;
}
.checkbox label:before {
  border-radius: 3px;
}

input[type=checkbox]:checked + label:before {
  content: "\2713";
  font-size: 20px;
  color: #fff;
  text-align: center;
  line-height: 12px;
}

::placeholder {
  color: #475d7a;
}




.submit:hover {


     background-color: #fff8f5;
   transform: scale(1.1);
}



.submit {
  cursor:pointer;
    color: #454141;
    border-radius: 10px;
  font-family: 'Trebuchet MS'; 
  font-weight: bolder;
   outline:0px;
  align-content: center;
  border:0px; 
  width:20%;
  background-color: #73c0e1;
  font-size: 20px;
  padding:12px;
 transform: scale(1);
   transition: background-color .2s, transform .2s;
}


select {
    color: #ffffff;
  font-family: 'Trebuchet MS'; 
  font-weight: bolder;
   outline:0px;
  align-content: center;
  border:0px;
  width:40%;
  background-color: #639db5;
  font-size: 20px;
  padding:12px;
  cursor:pointer; 
}


</style>


<head>
  <script type="module" src="./javascript/SelectionMenu.js">
  </script>
</head>
<title>BCIS Major/Minor Editor</title>
<body>
  <div style="width: 45%; padding-bottom: 2px;padding-top: 0.5px;padding-left: 1%;">
  <h1>BCIS Major/Minor Editor</h1>

  <form method="POST" action="./php/editMajor.php">
    <input name="Code" type="text" placeholder="Major/Minor Code" required><br>
    <input name="Name" type="text" placeholder="Major/Minor Name" required><br>
    Offered As:<br>Major <input id="Major"name="MajorOffered" type="checkbox"><label for="Major"></label>
    <br>Minor<input id="Minor"name="MinorOffered" type="checkbox"> <label for="Minor"></label><br>
    Courses : <input name="Courses" type="text" placeholder="e.g. MATH503 AND (COMP603 OR COMP610)"><br>
   <br>
    <input class="submit" type="submit" value="Edit Option">
  </form>




  <!-- Selection Dropdown -->
   <br>
  <div for="majortoedit">Choose an option to edit:
    <!-- This part will be directly modified by selection menu with a list containing all the names
   of the courses, as well as their indexin optionobjectsstore array (see below) -->
  <p id="majortoedit" style="margin-top: 0%; "></p></div>
  </div>
</body>
 
<script>
//array that stores all course objects in json
const optionobjectsstore = [];//this is the array that will hold the objects for the auto-fill
    function setInput(){
      var x = document.getElementById("majorselectionedit").value;//get value from selection
      if(x != ""){//if its not the null selection
        //replace with their respective information
        console.log(optionobjectsstore[x]);
        document.getElementsByName("Code")[0].value = optionobjectsstore[x].Code;
        document.getElementsByName("Name")[0].value = optionobjectsstore[x].Name;
       
        if(optionobjectsstore[x].AvailableAsMajor == true){//set checks based on if true or not
          document.getElementsByName("MajorOffered")[0].checked = 1;//check if true
        }
        else{
           document.getElementsByName("MajorOffered")[0].checked = 0;//uncheck if false
        }

        if(optionobjectsstore[x].AvailableAsMinor == true){//refer to above, this time for semester 2
          document.getElementsByName("MinorOffered")[0].checked = 1;
        }
        else{
           document.getElementsByName("MinorOffered")[0].checked = 0;
        }
        document.getElementsByName("Courses")[0].value = optionobjectsstore[x].Courses;
      }
      else{//if its the null selection
         document.getElementsByName("Code")[0].value = "";//reset
      document.getElementsByName("Name")[0].value = "";
      document.getElementsByName("Points")[0].value = 15;
      document.getElementsByName("Semester1Offered")[0].checked = 0;
      document.getElementsByName("Semester2Offered")[0].checked = 0;
     document.getElementsByName("Prerequisites")[0].value = "";
      document.getElementsByName("Corequisites")[0].value = "";
      }
     
    }

</script>
</html>
