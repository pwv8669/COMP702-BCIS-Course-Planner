<head>

<title>BCIS Major/Minor Editor</title>
<body>
    <div style="display: flex; flex-direction: column; position: relative; height: 100vh; width: 70%; margin-left: auto;  margin-right: auto; background-color: #b063c3">
        <div class="center-container" style=" width: 70%; margin-left: auto; margin-right: auto;">
            <h1 style="margin-top: 0; width: 100%;">BCIS Major/Minor Editor</h1>

            <label>Major or Minor:</label><br>
            <select id="MajorMinorSelection" onchange="SetupMajorMinorSelections()" style="margin-top: 10px;">
                <option>Major</option>
                <option>Minor</option>
            </select>
            <br></br>
            <form id="MajorMinorPostForm" method="POST" action="./php/editMajor.php">
                <input name="Code" type="text" placeholder="Code" required><br>
                <input name="Name" type="text" placeholder="Name" required><br><br>
                <input name="OriginalCode" type="hidden">
                <p>Courses: </p>
                <textarea style="field-sizing: content;resize: vertical;" name="Courses" type="text" placeholder="e.g. MATH503 AND (COMP603 OR COMP610)">
</textarea><br>
                <input name="IncompatibleMajors" type="text" placeholder="Incompatible major codes (comma-separated)"><br>
                <input name="IncompatibleMinors" type="text" placeholder="Incompatible minor codes (comma-separated)"><br>
                <label id="IsCoreRow"><input name="IsCore" type="checkbox" value="1"> Core option</label><br>
                <br>
                <input class="submit" type="submit" value="Edit Option" style="width: 130px">
            </form>




            <!-- Selection Dropdown -->
            <br>
            <div for="majortoedit">
                Choose an option to edit:
                <!-- This part will be directly modified by selection menu with a list containing all the names
            of the courses, as well as their indexin optionobjectsstore array (see below) -->
                <p id="majortoedit" style="margin-top: 0%; "></p>
            </div>
            <button type="button" title="Restore factory data" id="factoryResetButton">
              Factory Reset
            </button>
        </div>
    </div>
</body>
<script type="module">
  import {SetupMajorMinorSelections} from "./javascript/SelectionMenu.js";
  function testfunc(){
    if(document.getElementById("MajorMinorSelection").value == "Major"){
      document.getElementById("MajorMinorPostForm").action="./php/editMajor.php";
    }
    else{
      document.getElementById("MajorMinorPostForm").action="./php/editMinor.php";
      //console.log("setposttominor");
    }
    SetupMajorMinorSelections();
      document.getElementsByName("Code")[0].value = "";//reset
      document.getElementsByName("OriginalCode")[0].value = "";
      document.getElementsByName("Name")[0].value = "";
      document.getElementsByName("Courses")[0].value = "";
      document.getElementsByName("IncompatibleMajors")[0].value = "";
      document.getElementsByName("IncompatibleMinors")[0].value = "";
      document.getElementsByName("IsCore")[0].checked = false;
      document.getElementById("IsCoreRow").style.display =
        document.getElementById("MajorMinorSelection").value == "Major" ? "block" : "none";
    
  }
  console.log(document.getElementById("MajorMinorSelection").onchange = testfunc);

</script>
 <script>
//array that stores all course objects in json
let optionobjectsstore = [];//this is the array that will hold the objects for the auto-fill
    function setInput(){
      var x = document.getElementById("majorselectionedit").value;//get value from selection
      console.log(x);
      if(x != ""){//if its not the null selection
        //replace with their respective information
        console.log(optionobjectsstore[x]);
        document.getElementsByName("Code")[0].value = optionobjectsstore[x].Code;
        document.getElementsByName("OriginalCode")[0].value = optionobjectsstore[x].Code;
        document.getElementsByName("Name")[0].value = optionobjectsstore[x].Name;
        document.getElementsByName("IncompatibleMajors")[0].value = (optionobjectsstore[x].IncompatibleMajors ?? []).join(", ");
        document.getElementsByName("IncompatibleMinors")[0].value = (optionobjectsstore[x].IncompatibleMinors ?? []).join(", ");
        document.getElementsByName("IsCore")[0].checked = optionobjectsstore[x].IsCore === true;
       

        //creating the text for the courses
        let coursetext = "";
        for(const required in optionobjectsstore[x].Requirements){
         
          if((optionobjectsstore[x].Requirements[required].Courses.length) > 1){

            for(const multicourse in optionobjectsstore[x].Requirements[required].Courses){
              coursetext +=(optionobjectsstore[x].Requirements[required].Courses[multicourse])
               if(multicourse != optionobjectsstore[x].Requirements[required].Courses.length - 1){
                  coursetext += " OR ";
                }
                else{
                  coursetext += " ["+optionobjectsstore[x].Requirements[required].Count+"]";
                }
            }
          }
          else{
            coursetext +=(optionobjectsstore[x].Requirements[required].Courses[0])
          }
          if(required != optionobjectsstore[x].Requirements.length - 1){
            coursetext += ", ";
          }
          console.log(coursetext);
        }



        document.getElementsByName("Courses")[0].value = coursetext;
        //console.log(optionobjectsstore[x].Requirements[1].Courses);
      }
      else{//if its the null selection
         document.getElementsByName("Code")[0].value = "";//reset
      document.getElementsByName("OriginalCode")[0].value = "";
      document.getElementsByName("Name")[0].value = "";
      document.getElementsByName("Courses")[0].value = "";
      document.getElementsByName("IncompatibleMajors")[0].value = "";
      document.getElementsByName("IncompatibleMinors")[0].value = "";
      document.getElementsByName("IsCore")[0].checked = false;
      }
     
    }
</script>
</html>
